<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chungus Battles</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
      }

      #game-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      /* ── Chungus design tokens (mirrors chungus-battles-frontend/src/styles.scss) ── */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        text-align: center;
        padding: 1rem;
        background: radial-gradient(ellipse at center, rgba(40, 28, 0, 0.5) 0%, rgba(0, 0, 0, 0.88) 100%);
        color: #cbd5e1;
        font-family: Roboto, "Segoe UI", Arial, sans-serif;
        transition: opacity 0.35s ease-out;
      }

      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #boot .spinner {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 50%;
        border: 3px solid rgba(245, 158, 11, 0.25);
        border-top-color: #f59e0b;
        animation: cm-spin 0.9s linear infinite;
      }

      #boot .title {
        font-size: 1.1rem;
        letter-spacing: 0.02em;
        color: #f59e0b;
      }

      #boot .subtitle {
        font-size: 0.9rem;
        color: #9ca3af;
      }

      #boot a {
        color: #fbbf24;
      }

      @keyframes cm-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="spinner"></div>
      <div class="title" id="boot-title">Waking the server&hellip;</div>
      <div class="subtitle" id="boot-subtitle">This can take a few seconds after a quiet period.</div>
    </div>

    <iframe
      id="game-frame"
      src="https://chungus-battles-frontend.fly.dev/"
      allow="fullscreen; autoplay"
      title="Chungus Battles"
    ></iframe>

    <script>
      (function () {
        var boot = document.getElementById('boot');
        var frame = document.getElementById('game-frame');
        var title = document.getElementById('boot-title');
        var subtitle = document.getElementById('boot-subtitle');
        var loaded = false;

        function hideBoot() {
          if (loaded) return;
          loaded = true;
          boot.classList.add('hidden');
          window.setTimeout(function () {
            if (boot.parentNode) boot.parentNode.removeChild(boot);
          }, 400);
        }

        frame.addEventListener('load', hideBoot);

        window.setTimeout(function () {
          if (loaded) return;
          title.textContent = "Still loading…";
          subtitle.innerHTML =
            'Taking longer than usual. <a href="https://chungus-battles-frontend.fly.dev/" target="_blank" rel="noopener">Open the game in a new tab</a> instead.';
        }, 15000);
      })();
    </script>
  </body>
</html>
