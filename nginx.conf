server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Angular's build outputs content-hashed filenames for JS/CSS (main-XXXX.js, chunk-XXXX.js,
  # styles-XXXX.css) plus static assets (fonts, images) — safe to cache forever, since any
  # content change produces a new filename. Matched before the SPA fallback below, and with a
  # real 404 (not the index.html fallback) when a file is missing: without this, a browser still
  # holding an old cached index.html after a new deploy requests a chunk hash that no longer
  # exists, `try_files ... /index.html` used to mask that 404 by serving the HTML page itself for
  # the .js request — which the browser then fails to parse as a module ("'text/html' is not a
  # valid JavaScript MIME type").
  location ~* \.(?:js|mjs|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico|webp|avif|map)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html must never be cached — it's the one file that changes on every deploy, and it's
  # what points every client at that deploy's (also newly-hashed) chunk files. Caching it is what
  # lets the stale-chunk-request scenario above happen in the first place.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA fallback for real navigational routes (no file extension — /admin, /draft/:id, etc.).
  # Genuinely missing static assets are already caught by the location block above and get a
  # real 404 instead of masquerading as HTML.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
