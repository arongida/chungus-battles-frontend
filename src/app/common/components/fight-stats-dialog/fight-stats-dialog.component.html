<div class="fsd-modal">
  <div class="fsd-modal-header">
    <span>Fight Stats</span>
    <button class="fsd-close-btn" (click)="close()">×</button>
  </div>
  @if (data.subtitle) {
    <div class="fsd-modal-subtitle">{{ data.subtitle }}</div>
  }
  <div class="fsd-modal-body">
    <app-fight-stats-table [playerName]="data.playerName" [enemyName]="data.enemyName" [stats]="data.stats">
    </app-fight-stats-table>
  </div>
  @if (data.replayId) {
    <div class="fsd-modal-footer">
      <a mat-stroked-button class="fsd-replay-btn" [routerLink]="['/replay', data.replayId]" target="_blank" (click)="close()">
        Watch Replay
      </a>
    </div>
  }
</div>
